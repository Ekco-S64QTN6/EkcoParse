[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ekco-parse"
version = "1.0.0"
description = "High-performance EverQuest P99 desktop companion terminal dashboard"
readme = "README.md"
authors = [{ name = "Ekco" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
ekco-parse = "ekco_parse.main:main"
